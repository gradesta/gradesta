[package]
name = "gradesta-browser-headless"
version = "0.1.0"
edition = "2021"
description = "Headless browser for testing Gradesta protocol"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# WebSocket
tokio-tungstenite = "0.21"
futures-util = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
log = "0.4"
env_logger = "0.10"

# Random for action IDs
rand = "0.8"

# HTTP client for elf introduction
reqwest = { version = "0.11", features = ["json"] }
