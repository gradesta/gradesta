[package]
name = "nextcloud-connector"
version = "0.1.0"
edition = "2021"

[dependencies]
# iCalendar parsing
icalendar = { version = "0.16", features = ["parser"] }
# Async runtime
tokio = { version = "1", features = ["full"] }

# WebSocket
tokio-tungstenite = "0.21"
futures-util = "0.3"

# HTTP server (axum) for streaming and WebSocket
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }

# HTTP client for Nextcloud
reqwest = { version = "0.11", features = ["json", "stream"] }
bytes = "1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# UUID for note IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Cryptography
p256 = { version = "0.13", features = ["ecdsa"] }
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"

# JWT for streaming tokens
jsonwebtoken = "9"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Base64 encoding for tokens
base64 = "0.21"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Directories
dirs = "5.0"

# Logging
log = "0.4"
env_logger = "0.10"

# URL parsing
url = "2.5"

# Git for undo system
git2 = "0.18"

# XML parsing for WebDAV
quick-xml = { version = "0.31", features = ["serialize"] }

# CLI argument parsing
clap = { version = "4", features = ["derive"] }
