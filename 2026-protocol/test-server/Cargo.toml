[package]
name = "test-server"
version = "0.1.0"
edition = "2021"
description = "Standalone test server for Gradesta protocol testing"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# WebSocket
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Error handling
anyhow = "1.0"

# Random tokens
rand = "0.8"
base64 = "0.21"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Logging
log = "0.4"
env_logger = "0.10"

# CLI
clap = { version = "4", features = ["derive"] }

# MIME detection
mime_guess = "2.0"
