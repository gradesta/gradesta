[package]
name = "integration-test"
version = "0.1.0"
edition = "2021"
description = "End-to-end integration test for Elves system"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full", "process"] }

# WebSocket
tokio-tungstenite = "0.21"
futures-util = "0.3"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"

# Temporary directories
tempfile = "3"
