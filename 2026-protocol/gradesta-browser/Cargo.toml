[package]
name = "gradesta-browser"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
bevy = { version = "0.13", default-features = false, features = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_winit",
    "x11",
    "wayland",
    "png",
    "jpeg",
] }
bevy_egui = "0.25"
crossbeam-channel = "0.5"
dirs = "5.0"
gif = "0.12"
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
open = "5.0"
p256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tungstenite = "0.21"
url = "2.5"
