[package]
name = "gradesta-browser"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
bevy = { version = "0.13", default-features = false, features = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_winit",
    "x11",
    "wayland",
    "png",
    "jpeg",
] }
bevy_egui = "0.25"
crossbeam-channel = "0.5"
dirs = "5.0"
gif = "0.12"
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
open = "5.0"
p256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
sha2 = "0.10"
tungstenite = "0.21"
url = "2.5"
# Audio recording
cpal = "0.15"
# Audio playback
rodio = { version = "0.19", default-features = false, features = ["vorbis"] }
# OGG/Vorbis encoding
ogg = "0.9"
vorbis_rs = "0.4"
lewton = "0.10"
# Whisper transcription
whisper-rs = "0.14"
hound = "3.5"
# Standalone egui window for startup dialog
eframe = "0.27"
# Temp files for external video playback
tempfile = "3.10"
# Video playback (native in-browser)
mp4 = "0.14"
openh264 = "0.6"
# Audio decoding for video (AAC in MP4)
symphonia = { version = "0.5", features = ["aac", "isomp4"] }
