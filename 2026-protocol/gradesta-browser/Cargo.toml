[package]
name = "gradesta-browser"
version = "0.1.0"
edition = "2021"

[features]
default = []
# GPU acceleration for Whisper transcription
gpu-cuda = ["whisper-rs/cuda"]      # NVIDIA CUDA
gpu-vulkan = ["whisper-rs/vulkan"]  # Cross-platform Vulkan (Intel, AMD, NVIDIA)
gpu-metal = ["whisper-rs/metal"]    # Apple Metal (macOS/iOS)
gpu-hipblas = ["whisper-rs/hipblas"] # AMD ROCm (Linux only)

[dependencies]
anyhow = "1.0"
bevy = { version = "0.18", default-features = false, features = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_winit",
    "bevy_state",
    "x11",
    "wayland",
    "png",
    "jpeg",
] }
bevy_egui = "0.39"
crossbeam-channel = "0.5"
dirs = "5.0"
gif = "0.12"
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
open = "5.0"
p256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
sha2 = "0.10"
tungstenite = { version = "0.21", features = ["native-tls"] }
url = "2.5"
# Audio recording
cpal = "0.15"
# Audio playback
rodio = { version = "0.19", default-features = false, features = ["vorbis"] }
# OGG/Vorbis encoding
ogg = "0.9"
vorbis_rs = "0.4"
lewton = "0.10"
# Whisper transcription (GPU features available: cuda, vulkan, metal, hipblas)
whisper-rs = { version = "0.14", default-features = true }
hound = "3.5"
# Standalone egui window for startup dialog
eframe = "0.30"
# Temp files for external video playback
tempfile = "3.10"
# Video playback (native in-browser)
mp4 = "0.14"
openh264 = "0.6"
# Audio decoding for video (AAC in MP4)
symphonia = { version = "0.5", features = ["aac", "isomp4"] }
# Text-to-speech (uses system TTS backends: Speech Dispatcher on Linux, SAPI on Windows, etc.)
tts = "0.26"
# System clipboard (Wayland/X11/Windows/macOS)
# wayland-data-control enables wl-clipboard-rs for proper Wayland clipboard support
arboard = { version = "3.4", features = ["wayland-data-control"] }
# Timestamp formatting for debug logs
chrono = "0.4"
# Gamepad input
gilrs = "0.10"
# Base64 encoding for HTML export
base64 = "0.22"
# Native file dialogs for export
rfd = "0.14"
